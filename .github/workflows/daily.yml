name: Daily active ETF data + deploy

# 每个交易日收盘后跑一次：北京时间 16:00（UTC 08:00，周一至周五）。
# 节假日时抓取脚本会用 K 线判断“今天不是交易日”，只更新 latest.json，
# 不往 history 里追加假的一天；周末 Action 本身不跑。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Fetch daily quotes + PCF
        run: node scripts/fetch-data.mjs

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: daily update $(date -u +%F)"
          git push || echo "nothing to push or push failed"

      - name: Build Astro site
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 上传和部署分开两个 job：deploy-pages 查产物时，产物列表接口有
  # 最终一致性延迟；同一个 job 里上传完 200 多毫秒就查，偶尔查到 0 个
  # （actions/deploy-pages#451）。分开后部署在构建结束数秒后才开始查，
  # 避开这个竞态。
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
